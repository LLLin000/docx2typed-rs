[package]
name = "docx2typed-verify"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LLLin000/docx2typed"
description = "Deep module: independent verifier, read-only, canonical evidence (issue #55)"

[dependencies]
docx2typed-protocol = { version = "0.2.0", path = "../docx2typed-protocol" }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
