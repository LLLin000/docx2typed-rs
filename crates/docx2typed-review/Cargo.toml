[package]
name = "docx2typed-review"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/LLLin000/docx2typed"
description = "Issue #60: review collaboration lane (event queue, session snapshots, settlement) and transport-security primitives (issue #31 contract)"

[dependencies]
docx2typed-core = { version = "0.2.1", path = "../docx2typed-core" }
docx2typed-protocol = { version = "0.2.1", path = "../docx2typed-protocol" }
docx2typed-store = { version = "0.2.1", path = "../docx2typed-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
hex = "0.4"
# 256-bit capability bootstrap: OS CSPRNG (already in the tree via uuid).
getrandom = "0.2"

[dev-dependencies]
docx2typed-app = { version = "0.2.1", path = "../docx2typed-app" }
