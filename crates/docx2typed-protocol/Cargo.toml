[package]
name = "docx2typed-protocol"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/LLLin000/docx2typed"
description = "Protocol-major-1 leaf crate: Result/Diagnostic/Evidence DTOs, canonical JSON, negotiation (issue #55)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
