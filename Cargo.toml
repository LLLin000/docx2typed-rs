[package]
name = "docx2typed"
version = "0.2.0"
edition = "2021"
readme = "README.md"
repository = "https://github.com/LLLin000/docx2typed"
rust-version = "1.85"
description = "Structure-preserving DOCX editing engine with verified MCP review workflows"
license = "MIT"

[workspace]
members = [
    "crates/docx2typed-protocol",
    "crates/docx2typed-core",
    "crates/docx2typed-store",
    "crates/docx2typed-verify",
    "crates/docx2typed-review",
    "crates/docx2typed-app",
]
resolver = "2"

[dependencies]
docx2typed-app = { version = "0.2.0", path = "crates/docx2typed-app" }
docx2typed-core = { version = "0.2.0", path = "crates/docx2typed-core" }
docx2typed-protocol = { version = "0.2.0", path = "crates/docx2typed-protocol" }
docx2typed-review = { version = "0.2.0", path = "crates/docx2typed-review" }
docx2typed-store = { version = "0.2.0", path = "crates/docx2typed-store" }
serde_json = "1"

[features]
# Qualification-only: builds the differential/migrate/tracer [[test]] targets
# that drive the pinned external Python Reference checkout via
# DOCX2TYPED_PYTHON_ORACLE. Kept OFF by default so plain `cargo test
# --workspace` stays self-contained (no Python runtime, no external checkout,
# no repo-root fallback). Qualification command:
#   cargo test --workspace --features python-oracle
python-oracle = []

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"

# The three oracle tests below are physically split out of the default
# workspace test run via required-features: `cargo test --workspace` skips
# them, and they are built/run only when the python-oracle feature is on.
[[test]]
name = "differential"
path = "rust-tests/differential.rs"
required-features = ["python-oracle"]

[[test]]
name = "migrate"
path = "rust-tests/migrate.rs"
required-features = ["python-oracle"]

[[test]]
name = "tracer"
path = "rust-tests/tracer.rs"
required-features = ["python-oracle"]

[[test]]
name = "token_table_differential"
path = "rust-tests/token_table_differential.rs"

[[test]]
name = "style_id_differential"
path = "rust-tests/style_id_differential.rs"

[[test]]
name = "prose"
path = "rust-tests/prose.rs"

[[test]]
name = "govern"
path = "rust-tests/govern.rs"

[[test]]
name = "review60"
path = "rust-tests/review60.rs"

[[test]]
name = "structure"
path = "rust-tests/structure.rs"

[[test]]
name = "tracer62"
path = "rust-tests/tracer62.rs"

[[test]]
name = "replace_semantics"
path = "rust-tests/replace_semantics.rs"

[[test]]
name = "facade"
path = "rust-tests/facade.rs"


[[test]]
name = "cross_run_verify"
path = "rust-tests/cross_run_verify.rs"

